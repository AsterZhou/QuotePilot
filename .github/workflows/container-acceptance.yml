name: Real Docker build and persistence acceptance
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build actual image and test restart persistence
        run: python3 scripts/container_acceptance.py
